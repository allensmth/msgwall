<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Wall · 实时消息墙</title>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
  <style>
    /* ============================================================
       CSS Variables & Reset
       ============================================================ */
    :root {
      --bg: #0f1117;
      --surface: #161822;
      --surface-2: #1c1f2b;
      --border: #2a2d3a;
      --text: #e1e4ed;
      --text-muted: #8b8fa3;
      --accent: #6ee7b7;
      --accent-2: #818cf8;
      --accent-3: #f59e0b;
      --danger: #f87171;
      --radius: 10px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      --msg-max-age: 24 * 60 * 60 * 1000; /* 24 小时后标记为陈旧 */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.6;
      overflow: hidden;
    }

    /* ============================================================
       Layout
       ============================================================ */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ============================================================
       Header
       ============================================================ */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 16px;
      flex-wrap: wrap;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .header-stats {
      display: flex;
      gap: 18px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .stat-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: var(--font);
    }

    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn:active { transform: scale(0.97); }
    .btn.primary {
      background: var(--accent);
      color: #0f1117;
      border-color: var(--accent);
      font-weight: 600;
    }
    .btn.primary:hover { background: #5cd4a5; color: #0f1117; }

    /* ============================================================
       连接状态条
       ============================================================ */
    #connection-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      font-size: 12px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    #connection-status {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
      transition: background 0.3s;
    }

    .status-indicator.connected { background: var(--accent); }

    #webhook-form {
      margin-left: auto;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    #webhook-input {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-family: var(--font);
      width: 280px;
      outline: none;
      transition: border-color 0.15s;
    }

    #webhook-input:focus { border-color: var(--accent); }
    #webhook-input::placeholder { color: var(--text-muted); }

    /* ============================================================
       消息列表
       ============================================================ */
    #message-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 0 20px;
      scroll-behavior: smooth;
    }

    #message-list::-webkit-scrollbar { width: 6px; }
    #message-list::-webkit-scrollbar-track { background: transparent; }
    #message-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
    #message-list::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ============================================================
       单条消息卡片
       ============================================================ */
    .message-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 10px;
      animation: slide-in 0.25s ease-out;
      position: relative;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .message-card:hover {
      border-color: #3a3d4a;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message-card.stale {
      opacity: 0.5;
    }

    .message-card.stale .msg-content { filter: grayscale(0.3); }

    .msg-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 12px;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .msg-source {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .msg-author {
      color: var(--accent-2);
      font-weight: 500;
    }

    .msg-time {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    .msg-id {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-muted);
      opacity: 0.5;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .msg-id:hover { opacity: 1; color: var(--accent); }

    .msg-content {
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .msg-content :first-child { margin-top: 0; }
    .msg-content :last-child  { margin-bottom: 0; }

    /* Markdown 渲染样式 */
    .msg-content h1,
    .msg-content h2,
    .msg-content h3,
    .msg-content h4 {
      margin: 16px 0 8px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .msg-content h1 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .msg-content h2 { font-size: 1.25em; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    .msg-content h3 { font-size: 1.1em; }
    .msg-content h4 { font-size: 1em; }

    .msg-content p { margin: 8px 0; }

    .msg-content a {
      color: var(--accent-2);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s;
    }

    .msg-content a:hover { border-color: var(--accent-2); }

    .msg-content code {
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 0.88em;
      color: var(--accent-3);
    }

    .msg-content pre {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      margin: 12px 0;
      overflow-x: auto;
    }

    .msg-content pre code {
      background: none;
      border: none;
      padding: 0;
      color: var(--text);
      font-size: 0.85em;
      line-height: 1.6;
    }

    .msg-content blockquote {
      border-left: 3px solid var(--accent-2);
      margin: 12px 0;
      padding: 4px 16px;
      color: var(--text-muted);
    }

    .msg-content ul, .msg-content ol {
      margin: 8px 0;
      padding-left: 24px;
    }

    .msg-content li { margin: 4px 0; }

    .msg-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 0.9em;
    }

    .msg-content th, .msg-content td {
      border: 1px solid var(--border);
      padding: 6px 10px;
      text-align: left;
    }

    .msg-content th {
      background: var(--surface-2);
      font-weight: 600;
    }

    .msg-content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 16px 0;
    }

    .msg-content img {
      max-width: 100%;
      border-radius: 6px;
      margin: 8px 0;
    }

    .msg-content strong { font-weight: 600; }
    .msg-content em { font-style: italic; }

    /* ============================================================
       空状态
       ============================================================ */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      text-align: center;
      gap: 12px;
    }

    #empty-state-icon {
      font-size: 48px;
      opacity: 0.3;
    }

    #empty-state h2 {
      font-weight: 500;
      font-size: 18px;
      color: var(--text);
    }

    #empty-state p {
      font-size: 14px;
      max-width: 400px;
      line-height: 1.7;
    }

    /* ============================================================
       加载/错误指示
       ============================================================ */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-muted);
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 100;
      pointer-events: none;
    }

    #toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    #toast.error { border-color: var(--danger); color: var(--danger); }
    #toast.success { border-color: var(--accent); color: var(--accent); }

    /* ============================================================
       自动滚动控制
       ============================================================ */
    #scroll-controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 50;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    #scroll-controls.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #scroll-controls .btn {
      background: var(--surface);
      border-color: var(--border);
      padding: 6px 12px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header>
      <div class="logo">
        <div class="logo-icon">💬</div>
        <span>Message Wall</span>
      </div>

      <div class="header-stats">
        <span class="stat">
          <span class="stat-dot"></span>
          <span id="stat-connected">0</span> 连接
        </span>
        <span class="stat">
          📬 <span id="stat-messages">0</span> 条消息
        </span>
        <span class="stat">
          ⚡ <span id="stat-rate">0</span> 条/秒
        </span>
      </div>

      <div class="header-actions">
        <button class="btn" id="btn-clear" title="清空消息显示（不删服务端数据）">清屏</button>
        <button class="btn" id="btn-export" title="导出最近 500 条为 JSON">导出</button>
      </div>
    </header>

    <!-- 连接状态 + 测试 Webhook 表单 -->
    <div id="connection-bar">
      <div id="connection-status">
        <span class="status-indicator" id="status-dot"></span>
        <span id="status-text">连接中…</span>
      </div>
      <div id="webhook-form">
        <input
          id="webhook-input"
          type="text"
          placeholder="在此输入 Markdown，按回车通过 Webhook 发消息（测试用）"
          autocomplete="off"
        />
      </div>
    </div>

    <!-- 消息列表 -->
    <div id="message-list">
      <div id="empty-state">
        <div id="empty-state-icon">📬</div>
        <h2>消息墙空闲中</h2>
        <p>
          向 <code>POST /webhook</code> 发送消息，或在上方输入框回车测试。
          消息以 Markdown 格式实时呈现在这里。
        </p>
      </div>
    </div>

    <!-- 自动滚动浮动按钮 -->
    <div id="scroll-controls">
      <button class="btn" id="btn-scroll-bottom">→ 自动滚动</button>
      <button class="btn" id="btn-scroll-top">← 顶部</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <script>
    /* ============================================================
       前端逻辑
       ============================================================ */
    (function () {
      'use strict';

      // ---- DOM 引用
      const listEl     = document.getElementById('message-list');
      const emptyEl    = document.getElementById('empty-state');
      const statusDot  = document.getElementById('status-dot');
      const statusText = document.getElementById('status-text');
      const statConn   = document.getElementById('stat-connected');
      const statMsg    = document.getElementById('stat-messages');
      const statRate   = document.getElementById('stat-rate');
      const toastEl    = document.getElementById('toast');
      const webhookInp = document.getElementById('webhook-input');
      const btnClear   = document.getElementById('btn-clear');
      const btnExport  = document.getElementById('btn-export');
      const scrollCtrls= document.getElementById('scroll-controls');
      const btnScrollBottom = document.getElementById('btn-scroll-bottom');
      const btnScrollTop    = document.getElementById('btn-scroll-top');

      // ---- Markdown-it（CDN）
      const md = new MarkdownIt({
        html: true,
        linkify: true,
        typographer: true,
        highlight: (code, lang) => {
          if (lang) {
            return `<pre class="highlight-block" data-lang="${lang}"><code>${code}</code></pre>`;
          }
          return `<pre><code>${code}</code></pre>`;
        }
      });

      // ---- 状态
      let messages = [];          // 当前已渲染的消息数组（用于导出等）
      let autoScroll = true;
      let rateCounter = 0;
      let rateTimer = null;
      let unscrollCount = 0;     // 用户手动滚上去的次数，控制浮标显隐

      // ---- 格式化时间
      function fmtTime(ts) {
        const d = new Date(ts);
        const now = Date.now();
        const diff = now - ts;
        const isToday = d.toDateString() === new Date(now).toDateString();

        const h = String(d.getHours()).padStart(2, '0');
        const m = String(d.getMinutes()).padStart(2, '0');
        const s = String(d.getSeconds()).padStart(2, '0');

        if (diff < 60_000) return `刚刚 ${h}:${m}:${s}`;
        if (diff < 3_600_000) return `${Math.floor(diff / 60_000)} 分钟前`;
        if (isToday) return `${h}:${m}`;

        const y = d.getFullYear();
        const M = String(d.getMonth() + 1).padStart(2, '0');
        const D = String(d.getDate()).padStart(2, '0');
        return `${y}-${M}-${D} ${h}:${m}`;
      }

      // ---- Toast
      let toastTimer = null;
      function toast(msg, type = '') {
        toastEl.textContent = msg;
        toastEl.className = 'show ' + type;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toastEl.className = ''; }, 2500);
      }

      // ---- 创建消息卡片 DOM
      function createMessageCard(msg) {
        const card = document.createElement('div');
        card.className = 'message-card';
        card.dataset.id = msg.id;

        // 标记陈旧消息
        if (Date.now() - msg.timestamp > 24 * 60 * 60 * 1000) {
          card.classList.add('stale');
        }

        const sourceLabel = msg.source || 'webhook';
        const authorHtml  = msg.author
          ? `<span class="msg-author">@${escapeHtml(msg.author)}</span>`
          : '';

        card.innerHTML = `
          <div class="msg-meta">
            <span class="msg-source">📡 ${escapeHtml(sourceLabel)}</span>
            ${authorHtml}
            <span class="msg-time">${fmtTime(msg.timestamp)}</span>
            <span class="msg-id" title="点击复制 ID">${msg.id.slice(0, 8)}…</span>
          </div>
          <div class="msg-content">${msg.html || ''}</div>
        `;

        // 点击消息 ID 复制
        card.querySelector('.msg-id').addEventListener('click', () => {
          navigator.clipboard.writeText(msg.id).then(() => toast('ID 已复制')).catch(() => {});
        });

        return card;
      }

      // ---- 简单的 HTML 转义（用于元数据显示）
      function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      // ---- 插入消息到列表顶部（新的消息）
      function prependMessage(msg) {
        const card = createMessageCard(msg);
        // 如果 empty state 存在，先移除
        if (emptyEl && emptyEl.parentNode) {
          emptyEl.remove();
        }
        listEl.prepend(card);
        messages.unshift(msg);
        statMsg.textContent = messages.length;

        // 更新速率计数
        rateCounter++;
        if (!rateTimer) {
          rateTimer = setInterval(() => {
            statRate.textContent = rateCounter;
            rateCounter = 0;
          }, 1000);
        }

        // 自动滚动
        if (autoScroll) {
          listEl.scrollTop = 0;
        } else {
          unscrollCount++;
          scrollCtrls.classList.add('visible');
          clearTimeout(scrollCtrls._hideTimer);
          scrollCtrls._hideTimer = setTimeout(() => {
            scrollCtrls.classList.remove('visible');
          }, 3000);
        }

        // 用户滚动监听：如果用户往下滚了，停止自动滚动
        listEl.addEventListener('scroll', onUserScroll, { passive: true });
      }

      function onUserScroll() {
        const threshold = 60; // 距离顶部小于 60px 认为在自动滚动区
        if (listEl.scrollTop > threshold) {
          autoScroll = false;
          unscrollCount++;
          scrollCtrls.classList.add('visible');
        } else {
          // 回到顶部附近则恢复自动滚动
          if (!autoScroll && listEl.scrollTop < 10) {
            autoScroll = true;
          }
        }
      }

      // ---- SSE 连接
      let eventSource = null;

      function connectSSE() {
        if (eventSource) {
          eventSource.close();
        }

        statusDot.className = 'status-indicator';
        statusText.textContent = '连接中…';

        eventSource = new EventSource('/stream');

        eventSource.onopen = () => {
          statusDot.className = 'status-indicator connected';
          statusText.textContent = '已连接 · 实时接收中';
        };

        eventSource.onmessage = (e) => {
          try {
            const payload = JSON.parse(e.data);
            if (payload.type === 'history') {
              // 初始历史消息 —— 按时间戳升序排列后渲染
              const sorted = payload.data.sort((a, b) => a.timestamp - b.timestamp);
              renderHistory(sorted);
              statConn.textContent = eventSource?.readyState === EventSource.OPEN
                ? '1' : '0';
              toast(`加载 ${sorted.length} 条历史消息`, 'success');
            } else if (payload.type === 'message') {
              prependMessage(payload.data);
            }
          } catch (err) {
            // SSE 有时会发送空行，忽略
          }
        };

        eventSource.onerror = () => {
          statusDot.className = 'status-indicator';
          statusText.textContent = '连接断开 · 重连中…';
          toast('SSE 连接断开，正在重连', 'error');
          // 自动重连由浏览器 EventSource 实现，间隔约几秒
        };
      }

      // ---- 渲染历史消息
      function renderHistory(msgs) {
        // 清除 empty state
        if (emptyEl && emptyEl.parentNode) emptyEl.remove();

        // 清空当前列表
        listEl.innerHTML = '';

        messages = msgs.slice(); // 浅拷贝引用
        msgs.forEach(msg => {
          const card = createMessageCard(msg);
          listEl.appendChild(card);
        });

        statMsg.textContent = messages.length;
        statConn.textContent = '1';

        // 滚动到底部（显示最新）
        listEl.scrollTop = listEl.scrollHeight;
      }

      // ---- 测试 Webhook（通过上方输入框）
      webhookInp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const content = webhookInp.value.trim();
          if (!content) return;
          sendTestWebhook(content);
          webhookInp.value = '';
        }
      });

      function sendTestWebhook(content) {
        fetch('/webhook', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            content: content,
            source: 'web-test',
            author: 'you'
          })
        })
        .then(r => r.json())
        .then(data => {
          if (data.ok) toast('消息已发送', 'success');
          else toast('发送失败: ' + JSON.stringify(data), 'error');
        })
        .catch(err => toast('发送错误: ' + err.message, 'error'));
      }

      // ---- 清屏（只清除本地显示）
      btnClear.addEventListener('click', () => {
        listEl.innerHTML = '';
        messages = [];
        statMsg.textContent = '0';
        const empty = document.createElement('div');
        empty.id = 'empty-state';
        empty.innerHTML = `
          <div id="empty-state-icon">📬</div>
          <h2>已清屏</h2>
          <p>消息仍在服务器内存中。新消息到达后会重新显示。</p>
        `;
        listEl.appendChild(empty);
        toast('屏幕已清空', 'success');
      });

      // ---- 导出最近 500 条
      btnExport.addEventListener('click', () => {
        fetch('/api/messages?limit=500')
          .then(r => r.json())
          .then(data => {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `msgwall-export-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            toast('导出完成', 'success');
          })
          .catch(err => toast('导出失败: ' + err.message, 'error'));
      });

      // ---- 滚动控制按钮
      btnScrollBottom.addEventListener('click', () => {
        autoScroll = true;
        listEl.scrollTop = 0;
        toast('已开启自动滚动');
        scrollCtrls.classList.remove('visible');
      });

      btnScrollTop.addEventListener('click', () => {
        listEl.scrollTop = listEl.scrollHeight;
        toast('已跳转到底部');
      });

      // ---- 启动
      connectSSE();

      // 页面可见性变化时重连
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && !eventSource) {
          connectSSE();
        }
      });

      console.log('📬 Message Wall Frontend Ready');
    })();
  </script>
</body>
</html>
