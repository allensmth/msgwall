<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown 消息板</title>
  <!-- Markdown 渲染 + XSS 防护 -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #1a1d27;
      --border: #2a2d3a;
      --text: #e0e0e0;
      --text-dim: #888;
      --accent: #4fc3f7;
      --green: #66bb6a;
      --red: #ef5350;
      --orange: #ffa726;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* 顶栏 */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    header h1 { font-size: 18px; font-weight: 600; white-space: nowrap; }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--red); transition: background .3s;
    }
    .status-dot.connected { background: var(--green); }
    .status-text { font-size: 13px; color: var(--text-dim); }
    .msg-count {
      margin-left: auto;
      font-size: 13px; color: var(--text-dim);
      background: var(--bg); padding: 4px 12px; border-radius: 12px;
    }
    .btn {
      background: var(--border); color: var(--text);
      border: none; padding: 6px 14px; border-radius: 6px;
      cursor: pointer; font-size: 13px; transition: background .2s;
    }
    .btn:hover { background: #3a3d4a; }
    /* 消息列表 */
    #messages {
      flex: 1; overflow-y: auto; padding: 16px 20px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .msg-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
      animation: slideIn .25s ease-out;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg-meta {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 8px; font-size: 12px; color: var(--text-dim);
    }
    .msg-meta .seq { color: var(--accent); font-weight: 600; }
    .msg-meta .tag {
      background: var(--bg); padding: 2px 8px; border-radius: 4px;
      font-size: 11px;
    }
    .msg-meta .tag.level-ERROR { color: var(--red); }
    .msg-meta .tag.level-WARN  { color: var(--orange); }
    .msg-meta .tag.level-INFO  { color: var(--accent); }
    /* Markdown 内容渲染 */
    .msg-body { font-size: 14px; line-height: 1.7; word-break: break-word; }
    .msg-body h1, .msg-body h2, .msg-body h3 { margin: 10px 0 6px; }
    .msg-body p { margin: 6px 0; }
    .msg-body ul, .msg-body ol { margin: 6px 0; padding-left: 24px; }
    .msg-body li { margin: 3px 0; }
    .msg-body code {
      background: var(--bg); padding: 2px 6px; border-radius: 4px;
      font-family: 'SF Mono', Consolas, monospace; font-size: 13px;
    }
    .msg-body pre {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 12px; overflow-x: auto; margin: 8px 0;
    }
    .msg-body pre code { background: none; padding: 0; }
    .msg-body blockquote {
      border-left: 3px solid var(--accent); padding-left: 12px;
      margin: 8px 0; color: var(--text-dim);
    }
    .msg-body table { border-collapse: collapse; margin: 8px 0; }
    .msg-body th, .msg-body td {
      border: 1px solid var(--border); padding: 6px 12px; text-align: left;
    }
    .msg-body th { background: var(--bg); }
    .msg-body a { color: var(--accent); text-decoration: none; }
    .msg-body a:hover { text-decoration: underline; }
    .msg-body img { max-width: 100%; border-radius: 6px; }
    /* 滚动提示 */
    #scroll-hint {
      position: fixed; bottom: 20px; right: 20px;
      background: var(--accent); color: #000;
      padding: 8px 16px; border-radius: 20px;
      cursor: pointer; font-size: 13px; font-weight: 600;
      box-shadow: 0 4px 12px rgba(0,0,0,.4);
      display: none; z-index: 100;
    }
    /* 空状态 */
    #empty {
      text-align: center; color: var(--text-dim);
      padding: 60px 20px; font-size: 15px;
    }
    #empty code {
      background: var(--card-bg); padding: 3px 8px; border-radius: 4px;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <header>
    <div class="status-dot" id="status-dot"></div>
    <h1>📢 Markdown 消息板</h1>
    <span class="status-text" id="status-text">连接中...</span>
    <span class="msg-count" id="msg-count">0 条消息</span>
    <button class="btn" id="btn-clear" title="清空当前显示（不影响服务器）">清空</button>
    <button class="btn" id="btn-pause" title="暂停/恢复自动滚动">暂停滚动</button>
  </header>

  <div id="messages">
    <div id="empty">
      等待消息...<br><br>
      发送 webhook 示例：<br>
      <code>curl -X POST http://localhost:3000/webhook -H "Content-Type: application/json" -d '{"content":"# Hello\n\n**Markdown** 消息"}'</code>
    </div>
  </div>

  <div id="scroll-hint">↓ 新消息</div>

  <script>
    // ── 配置 ──────────────────────────────────────────
    const MAX_RENDER = 500; // 前端最多渲染条数，超出丢弃最旧的

    // ── DOM 引用 ──────────────────────────────────────
    const msgList    = document.getElementById('messages');
    const emptyHint  = document.getElementById('empty');
    const statusDot  = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const msgCount   = document.getElementById('msg-count');
    const scrollHint = document.getElementById('scroll-hint');
    const btnClear   = document.getElementById('btn-clear');
    const btnPause   = document.getElementById('btn-pause');

    // ── 状态 ──────────────────────────────────────────
    let autoScroll = true;
    let paused = false;
    let totalCount = 0;
    let renderedCount = 0;
    let pendingMessages = []; // 待批量渲染的消息
    let renderScheduled = false;

    // marked 配置
    marked.setOptions({ breaks: true, gfm: true });

    // ── 滚动控制 ──────────────────────────────────────
    msgList.addEventListener('scroll', () => {
      const atBottom = msgList.scrollHeight - msgList.scrollTop - msgList.clientHeight < 50;
      autoScroll = atBottom;
      scrollHint.style.display = atBottom ? 'none' : 'block';
    });

    scrollHint.addEventListener('click', () => {
      msgList.scrollTop = msgList.scrollHeight;
      autoScroll = true;
      scrollHint.style.display = 'none';
    });

    btnPause.addEventListener('click', () => {
      paused = !paused;
      btnPause.textContent = paused ? '恢复滚动' : '暂停滚动';
    });

    btnClear.addEventListener('click', () => {
      msgList.innerHTML = '';
      renderedCount = 0;
      msgCount.textContent = `${totalCount} 条消息（已清空显示）`;
    });

    // ── 渲染单条消息 ──────────────────────────────────
    function renderMessage(msg) {
      // 移除空状态提示
      if (emptyHint.parentNode) emptyHint.remove();

      const card = document.createElement('div');
      card.className = 'msg-card';

      // 元信息行
      const meta = document.createElement('div');
      meta.className = 'msg-meta';

      const seqSpan = document.createElement('span');
      seqSpan.className = 'seq';
      seqSpan.textContent = `#${msg.id}`;
      meta.appendChild(seqSpan);

      const timeSpan = document.createElement('span');
      timeSpan.textContent = formatTime(msg.timestamp);
      meta.appendChild(timeSpan);

      if (msg.source) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = msg.source;
        meta.appendChild(tag);
      }
      if (msg.level) {
        const tag = document.createElement('span');
        tag.className = `tag level-${msg.level}`;
        tag.textContent = msg.level;
        meta.appendChild(tag);
      }
      if (msg.title) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = msg.title;
        meta.appendChild(tag);
      }

      card.appendChild(meta);

      // Markdown 内容
      const body = document.createElement('div');
      body.className = 'msg-body';
      const rawHtml = marked.parse(msg.content);
      body.innerHTML = DOMPurify.sanitize(rawHtml);
      card.appendChild(body);

      msgList.appendChild(card);
      renderedCount++;

      // 超出渲染上限，移除最旧的
      if (renderedCount > MAX_RENDER) {
        msgList.removeChild(msgList.firstChild);
        renderedCount--;
      }
    }

    // ── 批量渲染（用 requestAnimationFrame 合并高频消息） ──
    function scheduleRender() {
      if (renderScheduled || pendingMessages.length === 0) return;
      renderScheduled = true;
      requestAnimationFrame(() => {
        const batch = pendingMessages;
        pendingMessages = [];
        renderScheduled = false;

        for (const msg of batch) {
          renderMessage(msg);
        }

        msgCount.textContent = `${totalCount} 条消息`;

        // 自动滚动到底部
        if (autoScroll && !paused) {
          msgList.scrollTop = msgList.scrollHeight;
        }
      });
    }

    // ── 时间格式化 ────────────────────────────────────
    function formatTime(iso) {
      const d = new Date(iso);
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      const ss = String(d.getSeconds()).padStart(2, '0');
      const ms = String(d.getMilliseconds()).padStart(3, '0');
      return `${hh}:${mm}:${ss}.${ms}`;
    }

    // ── WebSocket 连接（带自动重连） ──────────────────
    let ws;
    let reconnectDelay = 1000;
    const MAX_RECONNECT_DELAY = 10000;

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}/ws`);

      ws.onopen = () => {
        statusDot.classList.add('connected');
        statusText.textContent = '已连接';
        reconnectDelay = 1000;
      };

      ws.onmessage = (event) => {
        const payload = JSON.parse(event.data);

        if (payload.type === 'history') {
          // 初始历史消息
          totalCount = payload.total;
          for (const msg of payload.data) {
            renderMessage(msg);
          }
          msgCount.textContent = `${totalCount} 条消息`;
          if (autoScroll && !paused) {
            msgList.scrollTop = msgList.scrollHeight;
          }
        } else if (payload.type === 'message') {
          // 新消息，加入待渲染队列
          totalCount++;
          pendingMessages.push(payload.data);
          scheduleRender();
        }
      };

      ws.onclose = () => {
        statusDot.classList.remove('connected');
        statusText.textContent = '已断开，重连中...';
        setTimeout(connect, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 1.5, MAX_RECONNECT_DELAY);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    connect();
  </script>
</body>
</html>
